name: SN-IQ-05G guest portal verification

on:
  pull_request:
    paths:
      - 'src/domains/hospitality/guest-portal/**'
      - 'src/domains/ai/concierge/guest-request-*.functions.ts'
      - 'src/domains/ai/concierge/GuestRequestsPanel.tsx'
      - 'src/routes/guest.$token.tsx'
      - 'src/routes/api/public/ops/drain.ts'
      - 'supabase/migrations/*sn_iq_05*.sql'
  push:
    branches:
      - feat/sn-iq-05g-guest-self-service

jobs:
  guest-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Guest portal security and contract tests
        run: bunx vitest run src/domains/hospitality/guest-portal/guest-portal.security.test.ts
      - name: Build and generate route tree
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Guest portal lint
        run: bunx eslint src/domains/hospitality/guest-portal src/domains/ai/concierge/guest-request-dispatch.functions.ts src/domains/ai/concierge/guest-request-execution.functions.ts src/domains/ai/concierge/guest-requests.functions.ts src/domains/ai/concierge/GuestRequestsPanel.tsx src/routes/api/public/ops/drain.ts
