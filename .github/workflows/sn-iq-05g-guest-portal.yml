name: SN-IQ-05G guest portal verification

on:
  pull_request:
    paths:
      - 'src/domains/hospitality/guest-portal/**'
      - 'src/domains/ai/concierge/guest-request-*.functions.ts'
      - 'src/domains/ai/concierge/GuestRequestsPanel.tsx'
      - 'src/routes/guest.$token.tsx'
      - 'src/routes/api/public/ops/drain.ts'
      - 'supabase/migrations/*sn_iq_05*.sql'
      - 'supabase/migrations/*sn_gpa_*.sql'
      - 'supabase/tests/staynas_guest_portal_access.test.sql'
  push:
    branches:
      - feat/sn-iq-05g-guest-self-service

jobs:
  guest-portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staynas_gpa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staynas_gpa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated PostgreSQL schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d staynas_gpa_test -v ON_ERROR_STOP=1 -f supabase/verification/guest_portal_access_bootstrap.sql
      - name: Apply Guest Portal credential lifecycle migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d staynas_gpa_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261112130000_sn_gpa_01_credential_lifecycle.sql
      - name: Verify credential lifecycle, authorization and tenant isolation
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d staynas_gpa_test -v ON_ERROR_STOP=1 -f supabase/verification/guest_portal_access_security.sql
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Guest portal security and contract tests
        run: bunx vitest run src/domains/hospitality/guest-portal/guest-portal.security.test.ts
      - name: Build and generate route tree
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Guest portal lint
        run: bunx eslint src/domains/hospitality/guest-portal src/domains/ai/concierge/guest-request-dispatch.functions.ts src/domains/ai/concierge/guest-request-execution.functions.ts src/domains/ai/concierge/guest-requests.functions.ts src/domains/ai/concierge/GuestRequestsPanel.tsx src/routes/api/public/ops/drain.ts
