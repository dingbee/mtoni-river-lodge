name: CC-01 Supabase migration dry-run

on:
  push:
    branches:
      - feat/cc01-p0-commercial-foundation
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/migration-history-candidates/**"
      - "supabase/config.toml"
      - ".github/workflows/cc01-supabase-dry-run.yml"

permissions:
  contents: read

jobs:
  supabase-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require linked-project credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }
      - name: Link StayNas production project (no schema changes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref hpsryyywolitgeaacpoy --password "$SUPABASE_DB_PASSWORD"
      - name: Official remote migration dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --dry-run --linked
