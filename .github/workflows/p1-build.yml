name: P1 build verification

on:
  push:
    branches:
      - p1-hos-boundary
      - feat/finance-balance-consistency-phase2-03
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Finance and reservation lint
        run: bunx eslint src/domains/finance/finance.functions.ts src/domains/finance/payment-contract.ts src/domains/finance/payment-contract.test.ts src/domains/finance/finance-reconciliation.ts src/domains/finance/finance-reconciliation.test.ts src/domains/finance/finance-metrics.ts src/routes/_authenticated.admin.finance.reconciliation.tsx src/routes/_authenticated.admin.finance.index.tsx src/routes/_authenticated.admin.finance.analytics.tsx src/lib/finance-rpc.ts src/routes/_authenticated.admin.finance.payments.tsx src/lib/staff-reservations.functions.ts src/components/os/reservations/NewReservationDialog.tsx src/lib/payment-finalize.server.ts --rule 'prettier/prettier: off'
      - run: bun run build
