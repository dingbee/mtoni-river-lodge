name: P1 build verification

on:
  push:
    branches:
      - p1-hos-boundary
      - fix/ci-*
      - main
      - feat/finance-*
      - feat/spe-03-*
      - feat/spe-04-*
  pull_request:
    branches:
      - main
      - spe-02/**

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # TanStack Start generates routeTree.gen.ts during the Vite build.
      - name: Generate routes and verify production build
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Finance and reservation lint
        run: >-
          bunx eslint src/domains/finance/finance.functions.ts src/domains/finance/payment-contract.ts src/domains/finance/payment-contract.test.ts src/lib/finance-rpc.ts src/routes/_authenticated.admin.finance.payments.tsx src/lib/staff-reservations.functions.ts src/components/os/reservations/NewReservationDialog.tsx src/lib/payment-finalize.server.ts src/domains/commercial/commercial-payment.functions.ts src/domains/commercial/commercial-pesapal.server.ts src/routes/api/public/commercial-pesapal.ipn.ts --rule 'prettier/prettier: off'
