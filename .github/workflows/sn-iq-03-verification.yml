name: SN-IQ-03 quote and recommendation verification

on:
  push:
    branches:
      - feat/sn-iq-03-intelligent-booking-sales
      - integration/sn-iq-01-03-port-2026-10-31
  pull_request:
    branches:
      - main
      - integration/staynas-ops-release-2026-10-31
      - integration/staynas-ops-release-2026-10-31

jobs:
  concierge-verification:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run concierge quote and recommendation regressions
        run: bunx vitest run src/domains/ai/concierge/concierge.tools.test.ts src/domains/ai/concierge/concierge.recommendations.test.ts src/lib/booking-hold-policy.test.ts
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Lint changed concierge code and tests
        run: >-
          bunx eslint src/domains/ai/concierge/concierge.tools.ts src/domains/ai/concierge/concierge.recommendations.ts src/domains/ai/concierge/concierge.tools.test.ts src/domains/ai/concierge/concierge.recommendations.test.ts src/lib/booking-hold-policy.ts src/lib/booking-hold-policy.test.ts --rule 'prettier/prettier: off'
      - name: Production build
        run: bun run build
