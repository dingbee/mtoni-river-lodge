name: SN-IQ-04 omnichannel contract verification

on:
  push:
    branches:
      - feat/sn-iq-04-omnichannel-communications
      - fix/sn-iq-04-*
      - fix/ci-*
      - feat/sn-iq-04-clean
      - feat/cc01-p0-commercial-foundation
    paths:
      - "src/domains/ai/concierge/**"
      - "src/routes/_authenticated.admin.ai.concierge.conversations.tsx"
      - "src/routes/api/public/*webhook*"
      - ".github/workflows/sn-iq-04-verification.yml"
  pull_request:
    branches:
      - main

jobs:
  omnichannel-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run omnichannel contract and provider adapter regressions
        run: bunx vitest run src/domains/ai/concierge/omnichannel.contracts.test.ts src/domains/ai/concierge/webhooks/webhook-processor.server.test.ts
      # TanStack Start generates routeTree.gen.ts during the Vite build.
      - name: Generate routes and verify production build
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Lint omnichannel contracts, provider adapters, webhook security and tests
        run: >-
          bunx eslint src/domains/ai/concierge/omnichannel.contracts.ts src/domains/ai/concierge/omnichannel.contracts.test.ts src/domains/ai/concierge/omnichannel.ledger.types.ts src/domains/ai/concierge/providers src/domains/ai/concierge/webhooks src/domains/ai/concierge/unified-inbox.functions.ts src/routes/_authenticated.admin.ai.concierge.conversations.tsx src/domains/ai/concierge/property-channel-settings.functions.ts --rule 'prettier/prettier: off'
