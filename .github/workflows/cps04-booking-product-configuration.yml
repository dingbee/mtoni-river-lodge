name: CPS-04 booking product configuration
on:
  push:
    branches:
      - feat/cps-04-room-rate-offer-configuration
  pull_request:
    branches:
      - main
jobs:
  cps04-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cps04_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cps04_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cps04_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap only the existing StayNas contracts CPS-04 consumes
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $$;
          CREATE TYPE public.app_role AS ENUM ('admin','owner','manager','finance','marketing','reservations','reception','user');
          CREATE TABLE public.staynas_organisations(id uuid PRIMARY KEY,slug text NOT NULL,name text NOT NULL);
          CREATE TABLE public.staynas_properties(
            id uuid PRIMARY KEY,organisation_id uuid NOT NULL REFERENCES public.staynas_organisations(id),
            currency text NOT NULL,timezone text NOT NULL,status text NOT NULL
          );
          CREATE TABLE public.staynas_property_members(
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            user_id uuid NOT NULL REFERENCES auth.users(id),role public.app_role NOT NULL,status text NOT NULL,
            PRIMARY KEY(property_id,user_id)
          );
          CREATE FUNCTION public.staynas_user_has_property_access(_uid uuid,_property_id uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog,public AS $$
            SELECT auth.uid()=_uid AND EXISTS(
              SELECT 1 FROM public.staynas_property_members m
              WHERE m.user_id=_uid AND m.property_id=_property_id AND m.status='active'
            )
          $$;
          CREATE FUNCTION public.has_any_role(_uid uuid,_roles public.app_role[])
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=pg_catalog,public AS $$
            SELECT auth.uid()=_uid AND EXISTS(
              SELECT 1 FROM public.staynas_property_members m
              WHERE m.user_id=_uid AND m.status='active' AND m.role=ANY(_roles)
            )
          $$;
          CREATE TABLE public.rooms(id uuid PRIMARY KEY,property_id uuid NOT NULL REFERENCES public.staynas_properties(id),catalogue_type_id uuid NOT NULL,status text NOT NULL);
          CREATE TABLE public.staynas_rate_plans(
            id uuid PRIMARY KEY,property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            publication_status text NOT NULL,active boolean NOT NULL
          );
          CREATE TABLE public.staynas_rate_plan_publications(
            id uuid PRIMARY KEY,property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            rate_plan_id uuid NOT NULL REFERENCES public.staynas_rate_plans(id),
            publication_number integer NOT NULL,currency text NOT NULL,room_type_assignments jsonb NOT NULL DEFAULT '[]'::jsonb
          );
          GRANT SELECT ON public.staynas_properties,public.rooms,public.staynas_rate_plans,public.staynas_rate_plan_publications TO authenticated,service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;
          SQL
      - name: Apply CPS-04 configuration migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261110160000_cps04_booking_product_configuration.sql
      - name: Verify tenant isolation and public write denial
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/cps04_booking_product_configuration.test.sql

  cps04-application:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build and type-check application
        run: |
          bun run build
          bunx tsc --noEmit
      - name: Lint CPS-04 implementation
        run: bunx eslint src/domains/booking/booking-product-configuration.functions.ts src/routes/_authenticated.admin.booking-products.tsx src/components/os/nav-config.ts
