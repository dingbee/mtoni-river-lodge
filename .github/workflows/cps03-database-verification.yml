name: CPS-03 campaign tenant isolation verification

on:
  push:
    branches:
      - feat/cps-03-*
  pull_request:
    branches:
      - main

jobs:
  cps03-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cps03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cps03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cps03_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated StayNas tenancy contracts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $function$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          CREATE TYPE public.app_role AS ENUM (
            'admin','reservations','user','owner','manager','reception',
            'marketing','housekeeping','finance','editor'
          );
          CREATE TABLE public.staynas_organisations (
            id uuid PRIMARY KEY,
            slug text NOT NULL UNIQUE,
            name text NOT NULL,
            status text NOT NULL DEFAULT 'active'
          );
          CREATE TABLE public.staynas_properties (
            id uuid PRIMARY KEY,
            organisation_id uuid NOT NULL REFERENCES public.staynas_organisations(id),
            slug text NOT NULL,
            code text NOT NULL,
            name text NOT NULL,
            status text NOT NULL
          );
          CREATE TABLE public.staynas_property_members (
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            user_id uuid NOT NULL REFERENCES auth.users(id),
            role public.app_role NOT NULL,
            status text NOT NULL,
            PRIMARY KEY (property_id, user_id)
          );
          CREATE FUNCTION public.staynas_user_has_property_access(_uid uuid, _property_id uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
            SELECT _uid IS NOT NULL AND _property_id IS NOT NULL
              AND auth.uid() = _uid
              AND EXISTS (
                SELECT 1 FROM public.staynas_property_members m
                WHERE m.user_id = _uid AND m.property_id = _property_id AND m.status = 'active'
              )
          $function$;
          CREATE FUNCTION public.has_any_role(_uid uuid, _roles public.app_role[])
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
            SELECT _uid IS NOT NULL AND auth.uid() = _uid
              AND EXISTS (
                SELECT 1 FROM public.staynas_property_members m
                WHERE m.user_id = _uid AND m.status = 'active' AND m.role = ANY(_roles)
              )
          $function$;
          CREATE TABLE public.rooms (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            slug text NOT NULL,
            name text NOT NULL,
            status text NOT NULL
          );
          CREATE TABLE public.bookings (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id)
          );
          CREATE TABLE public.staynas_rate_plan_publications (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            code text NOT NULL,
            name text NOT NULL,
            currency text NOT NULL
          );
          SQL
      - name: Apply CPS-03 campaign data and tenant isolation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109130000_cps03_campaign_data_tenant_isolation.sql
      - name: Apply CPS-03 publication, route and attribution hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109150000_cps03_publication_and_route_guards.sql
      - name: Verify tenant boundaries, composite references and public publication gates
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/cps03_campaign_tenant_isolation.test.sql
