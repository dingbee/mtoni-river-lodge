name: CPS-03 campaign tenant isolation verification

on:
  push:
    branches:
      - feat/cps-03-*
  pull_request:
    branches:
      - main
      - feat/cps-02-commercial-entitlements-quota

jobs:
  cps03-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cps03_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cps03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cps03_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated StayNas tenancy contracts
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $function$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $function$;
          CREATE TYPE public.app_role AS ENUM (
            'admin','reservations','user','owner','manager','reception',
            'marketing','housekeeping','finance','editor'
          );
          CREATE TABLE public.staynas_organisations (
            id uuid PRIMARY KEY,
            slug text NOT NULL UNIQUE,
            name text NOT NULL,
            status text NOT NULL DEFAULT 'active'
          );
          CREATE TABLE public.staynas_properties (
            id uuid PRIMARY KEY,
            organisation_id uuid NOT NULL REFERENCES public.staynas_organisations(id),
            slug text NOT NULL,
            code text NOT NULL,
            name text NOT NULL,
            status text NOT NULL,
            currency text NOT NULL DEFAULT 'TZS',
            timezone text NOT NULL DEFAULT 'Africa/Dar_es_Salaam'
          );
          GRANT ALL ON public.staynas_properties TO service_role;
          CREATE TABLE public.staynas_property_members (
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            user_id uuid NOT NULL REFERENCES auth.users(id),
            role public.app_role NOT NULL,
            status text NOT NULL,
            PRIMARY KEY (property_id, user_id)
          );
          CREATE FUNCTION public.staynas_user_has_property_access(_uid uuid, _property_id uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
            SELECT _uid IS NOT NULL AND _property_id IS NOT NULL
              AND auth.uid() = _uid
              AND EXISTS (
                SELECT 1 FROM public.staynas_property_members m
                WHERE m.user_id = _uid AND m.property_id = _property_id AND m.status = 'active'
              )
          $function$;
          CREATE FUNCTION public.has_any_role(_uid uuid, _roles public.app_role[])
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $function$
            SELECT _uid IS NOT NULL AND auth.uid() = _uid
              AND EXISTS (
                SELECT 1 FROM public.staynas_property_members m
                WHERE m.user_id = _uid AND m.status = 'active' AND m.role = ANY(_roles)
              )
          $function$;
          CREATE TABLE public.rooms (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            slug text NOT NULL,
            name text NOT NULL,
            status text NOT NULL,
            catalogue_type_id uuid NOT NULL
          );
          CREATE TABLE public.bookings (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id)
          );
          CREATE TABLE public.staynas_rate_plans (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            code text NOT NULL,
            name text NOT NULL,
            currency text NOT NULL,
            publication_status text NOT NULL,
            active boolean NOT NULL DEFAULT true
          );
          CREATE TABLE public.staynas_rate_plan_publications (
            id uuid PRIMARY KEY,
            property_id uuid NOT NULL REFERENCES public.staynas_properties(id),
            rate_plan_id uuid NOT NULL REFERENCES public.staynas_rate_plans(id),
            publication_number integer NOT NULL DEFAULT 1,
            rate_plan_version integer NOT NULL DEFAULT 1,
            code text NOT NULL,
            name text NOT NULL,
            currency text NOT NULL,
            effective_from date,
            effective_to date,
            snapshot_hash text NOT NULL DEFAULT '0123456789abcdef0123456789abcdef',
            room_type_assignments jsonb NOT NULL DEFAULT '[]'::jsonb,
            published_at timestamptz NOT NULL DEFAULT now()
          );
          GRANT ALL ON ALL TABLES IN SCHEMA public TO service_role;
          SQL
      - name: Apply CPS-03 campaign data and tenant isolation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109130000_cps03_campaign_data_tenant_isolation.sql
      - name: Apply CPS-03 publication, route and attribution hardening
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109150000_cps03_publication_and_route_guards.sql
      - name: Apply CPS-03 transactional campaign runtime migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109170000_cps03_campaign_runtime.sql
      - name: Apply CPS-03 attribution idempotency migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109180000_cps03_attribution_idempotency.sql
      - name: Apply CPS-03 property-timezone schedule migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109190000_cps03_property_timezone_schedule.sql
      - name: Apply CPS-03 published configuration immutability migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261109200000_cps03_published_configuration_lock.sql
      - name: Verify tenant boundaries, composite references, publication, quota and public visibility
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/cps03_campaign_tenant_isolation.test.sql

  cps03-application:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Generate routes and verify production build
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: CPS-03 and booking-flow lint
        run: >-
          bunx eslint
          src/domains/booking-campaigns/campaigns.functions.ts
          src/routes/_authenticated.admin.distribution.campaigns.tsx
          'src/routes/p.$propertySlug.campaign.$campaignSlug.tsx'
          'src/routes/$propertySlug.tsx'
          src/routes/book.tsx
          src/lib/booking.functions.ts
          src/lib/public-booking.functions.ts
          src/components/os/nav-config.ts
          --rule 'prettier/prettier: off'
