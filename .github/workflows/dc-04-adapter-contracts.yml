name: StayNas DC-04 and DC-07 distribution contracts

on:
  pull_request:
    branches:
      [main, feat/dc06-05-cross-domain-reconciliation, feat/dc06-07a-channex-adapter-foundation]
    paths:
      - "src/domains/distribution/**"
      - "src/routes/_authenticated.admin.settings.distribution.tsx"
      - "src/routes/_authenticated.admin.settings.index.tsx"
      - "supabase/migrations/*dc07a*"
      - "supabase/migrations/*dc07b*"
      - "supabase/migrations/20261112120000_dc07c_channex_catalogue_seed_reconciliation.sql"
      - "scripts/ci/dc07c-channex-catalogue-smoke.sql"
      - "docs/dc-04-adapter-runtime-contract.md"
      - ".github/workflows/dc-04-adapter-contracts.yml"
  push:
    branches:
      - feat/dc-04-*
      - feat/dc06-*
      - feat/dc07-*
      - main

jobs:
  adapter-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Adapter registry and DC-07A contract tests
        run: bunx vitest run src/domains/distribution
      - name: Production build (generates TanStack route tree)
