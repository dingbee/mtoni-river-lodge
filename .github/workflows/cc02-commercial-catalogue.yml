name: CC-02 commercial catalogue verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/domains/commercial/**"
      - ".github/workflows/cc02-commercial-catalogue.yml"

jobs:
  cc02-01:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Commercial catalogue contract tests
        run: bunx vitest run src/domains/commercial/catalogue.test.ts
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Commercial domain lint
        run: bunx eslint src/domains/commercial --rule 'prettier/prettier: off'
