name: SPE-07 distribution contracts

on:
  push:
    branches:
      - feat/spe-07-*
  pull_request:
    paths:
      - "src/domains/distribution/**"
      - "src/routes/_authenticated.admin.distribution.tsx"
      - "src/lib/staynas-rpc.ts"
      - "src/components/os/nav-config.ts"
      - "docs/database/SPE-07-distribution-persistence.sql"
      - "supabase/tests/**"
      - "supabase/review/**"
      - "supabase/migrations/**"
      - "scripts/ci/normalize-optional-legacy-revokes.py"
      - ".github/workflows/spe-07-distribution.yml"

jobs:
  distribution-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Distribution contract and reliability tests
        run: bunx vitest run src/domains/distribution
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Distribution lint
        run: >-
          bunx eslint src/domains/distribution
          --rule "prettier/prettier: off"
      - name: Production build
        run: bun run build

  distribution-database-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: "2.122.1"
      - name: Normalize optional legacy migration drift in ephemeral checkout
        run: python3 scripts/ci/normalize-optional-legacy-revokes.py
      - name: Start local Supabase database
        run: supabase start --exclude studio,inbucket,storage-api,imgproxy,vector
      - name: Apply migrations and review-only schema required by database contracts
        run: |
          supabase db reset
          for migration in \
            supabase/review/20261107100000_staynas_website_demo_requests.sql \
            supabase/review/20261109130000_cc06_founder_notifications.sql \
            supabase/review/20261109140000_cc06_commercial_account_contacts.sql \
            supabase/review/20261109150000_cc06_founder_subscription_creation.sql \
          do
            psql "postgresql://postgres:postgres@localhost:54322/postgres" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run database contracts
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
