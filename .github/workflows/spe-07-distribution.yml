name: SPE-07 distribution contracts

on:
  push:
    branches:
      - feat/spe-07-*
    paths:
      - "src/domains/distribution/**"
      - "docs/database/SPE-07-distribution-persistence.sql"
      - ".github/workflows/spe-07-distribution.yml"
  pull_request:
    paths:
      - "src/domains/distribution/**"
      - "docs/database/SPE-07-distribution-persistence.sql"
      - ".github/workflows/spe-07-distribution.yml"

jobs:
  distribution-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Distribution contract and reliability tests
        run: bunx vitest run src/domains/distribution
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Distribution lint
        run: bunx eslint src/domains/distribution --rule 'prettier/prettier: off'
      - name: Production build
        run: bun run build

  distribution-database-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration using Supabase CLI
        shell: bash
        run: |
          supabase migration new spe07_distribution_persistence
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_spe07_distribution_persistence.sql' -print -quit)"
          test -n "$migration_file"
          cp docs/database/SPE-07-distribution-persistence.sql "$migration_file"
          echo "Generated migration: $migration_file"
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Apply all migrations to clean local database
        run: supabase db reset --local
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
