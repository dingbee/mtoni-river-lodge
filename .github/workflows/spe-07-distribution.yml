name: StayNas DC-series distribution contracts

on:
  push:
    branches:
      - feat/dc*
      - main
  pull_request:
    paths:
      - "src/domains/distribution/**"
      - "src/routes/_authenticated.admin.distribution.tsx"
      - "src/lib/operations.functions.ts"
      - "src/lib/front-desk.functions.ts"
      - "src/lib/room-board-allocation-mapper.ts"
      - "src/lib/room-board-allocation-mapper.test.ts"
      - "src/components/os/operations/RoomStatusBoard.tsx"
      - "src/lib/staynas-rpc.ts"
      - "src/components/os/nav-config.ts"
      - "docs/dc-series-production-migration-reconciliation.md"
      - "docs/archive/SPE-07-legacy-schema-deprecation.md"
      - "supabase/tests/**"
      - "supabase/review/**"
      - "supabase/migrations/**"
      - "scripts/ci/normalize-optional-legacy-revokes.py"
      - ".github/workflows/spe-07-distribution.yml"

jobs:
  distribution-contracts:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Distribution contract and reliability tests
        run: bunx vitest run src/domains/distribution
