name: StayNas DC-05 reservation ingestion

on:
  push:
    branches:
      - feat/dc-05-*
  pull_request:
    branches:
      - integration/dc05-foundation
    paths:
      - "src/domains/distribution/reservations/**"
      - "src/domains/distribution/adapters/**"
      - ".github/workflows/dc-05-reservation-ingestion.yml"

jobs:
  reservation-ingestion:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Reservation ingestion contract tests
        run: bunx vitest run src/domains/distribution/reservations
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
