name: P1 test verification
# Shared TypeScript baseline and Finance Phase 2 regression verification

on:
  push:
    branches:
      - fix/pesapal-*
      - fix/ci-*
      - main
      - feat/finance-*
      - feat/spe-03-*
      - feat/spe-04-*
      - feat/cc-03-*
      - spe-02/**
  pull_request:
    branches:
      - main
      - spe-02/**

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run notification, shared, Finance Phase 2 and Pesapal regression suites
        run: >-
          bunx vitest run
          src/lib/notifications.test.ts
          src/lib/booking-lifecycle.test.ts
          src/lib/housekeeping-state-machine.test.ts
          src/lib/housekeeping-offline.test.ts
          src/domains/ai/concierge/request-categorization.test.ts
          src/domains/finance/payment-contract.test.ts
          src/domains/finance/finance-currency.test.ts
          src/domains/finance/pricing-engine.test.ts
          src/domains/finance/finance-reconciliation.test.ts
          src/domains/finance/seasonal-pricing.test.ts
          src/domains/finance/daily-rate-calendar.test.ts
          src/domains/finance/rate-overrides.test.ts
          src/domains/finance/rate-plan-restrictions.test.ts
          src/domains/finance/rate-plan-publication.test.ts
          src/lib/pesapal-currency.test.ts
          src/domains/commercial/catalogue.test.ts
          src/domains/commercial/pricing-engine.test.ts
          src/domains/commercial/package-composition.test.ts
          src/domains/commercial/trial-configuration.test.ts
          src/domains/commercial/founder-administration.test.ts
          src/domains/commercial/commercial-api-contract.test.ts
          src/domains/commercial/subscription-lifecycle-contract.test.ts
          src/domains/commercial/subscription.authorization.test.ts
          src/domains/commercial/settlement-contract.test.ts
          src/domains/commercial/commercial-billing-engine.test.ts
          src/domains/commercial/commercial-payment-adapters.test.ts
          src/domains/commercial/commercial-reconciliation-engine.test.ts
          src/domains/payments/provider-adapter.contract.test.ts
      # TanStack Start generates routeTree.gen.ts during the Vite build.
      - name: Generate routes and verify production build
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Finance and shared changed-file lint
        run: >-
          bunx eslint
          src/domains/finance/finance.functions.ts
          src/domains/finance/payment-contract.ts
          src/domains/finance/payment-contract.test.ts
          src/domains/finance/finance-currency.ts
          src/domains/finance/pricing-engine.ts
          src/domains/finance/pricing-engine.test.ts
          src/domains/finance/finance-currency.test.ts
          src/domains/finance/finance-reconciliation.ts
          src/domains/finance/finance-reconciliation.test.ts
          src/domains/finance/seasonal-pricing.ts
          src/domains/finance/daily-rate-calendar.ts
          src/domains/finance/rate-overrides.ts
          src/domains/finance/rate-overrides.test.ts
          src/domains/finance/rate-plan-restrictions.ts
          src/domains/finance/rate-plan-restrictions.test.ts
          src/domains/finance/rate-plan-publication.ts
          src/domains/finance/rate-plan-publication.test.ts
          src/routes/_authenticated.admin.finance.rate-plans.tsx
          src/routes/_authenticated.admin.finance.rate-overrides.tsx
          src/domains/finance/seasonal-pricing.test.ts
          src/lib/finance-rpc.ts
          src/lib/pricing.ts
          src/routes/_authenticated.admin.finance.payments.tsx
          src/routes/_authenticated.admin.finance.rate-plans.tsx
          src/lib/staff-reservations.functions.ts
          src/components/os/reservations/NewReservationDialog.tsx
          src/lib/payment-finalize.server.ts
          src/lib/pesapal-currency.ts
          src/lib/pesapal-currency.test.ts
          src/domains/commercial/catalogue.ts
          src/domains/commercial/catalogue-contract.ts
          src/domains/commercial/catalogue.test.ts
          src/domains/commercial/pricing-contract.ts
          src/domains/commercial/pricing-engine.ts
          src/domains/commercial/pricing-engine.test.ts
          src/domains/commercial/package-composition-contract.ts
          src/domains/commercial/package-composition.test.ts
          src/domains/commercial/trial-configuration-contract.ts
          src/domains/commercial/trial-configuration.test.ts
          src/domains/commercial/founder-administration-contract.ts
          src/domains/commercial/founder-administration.test.ts
          src/domains/commercial/commercial-api-contract.ts
          src/domains/commercial/commercial-api-contract.test.ts
          src/domains/commercial/subscription-lifecycle-contract.ts
          src/domains/commercial/subscription-lifecycle-contract.test.ts
          src/domains/commercial/subscription.functions.ts
          src/domains/commercial/subscription.authorization.test.ts
          src/domains/commercial/settlement-contract.ts
          src/domains/commercial/settlement-contract.test.ts
          src/domains/commercial/commercial-billing-engine.ts
          src/domains/commercial/commercial-billing-engine.test.ts
          src/domains/commercial/commercial-payment-adapters.ts
          src/domains/commercial/commercial-payment-adapters.test.ts
          src/domains/commercial/commercial-reconciliation-engine.test.ts
          src/domains/commercial/commercial-payment.functions.ts
          src/domains/payments/payment-provider-management.functions.ts
          src/domains/payments/provider-adapter.contract.ts
          src/domains/payments/provider-adapter.contract.test.ts
          src/routes/_authenticated.admin.settings.payment-providers.tsx
          src/domains/commercial/commercial-pesapal.server.ts
          src/routes/api/public/commercial-pesapal.ipn.ts
          --rule 'prettier/prettier: off'
