name: P1 test verification

on:
  pull_request:
    branches:
      - main
      - sprint/tenant-isolation-payment-integrity
      - integration/staynas-ops-release-2026-10-31

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run complete Vitest suite
        run: bunx vitest run
      - name: Lint changed root route (exclude existing repository-wide formatting debt)
        run: bunx eslint src/routes/__root.tsx --rule 'prettier/prettier: off'
      - name: Verify production build
        run: bun run build
