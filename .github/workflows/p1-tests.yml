name: P1 test verification
# Shared TypeScript baseline and Finance Phase 2 regression verification

on:
  push:
    branches:
      - fix/pesapal-*
      - fix/ci-*
      - main
      - feat/sn-oc-04-operational-intelligence
      - feat/finance-*
      - feat/spe-03-*
      - feat/spe-04-*
      - feat/spe-07-*
      - feat/spe-08-*
      - feat/cc-03-*
      - feat/cc03-founder-*
      - feat/guest-portal-access-management-release
      - spe-02/**
  pull_request:
    branches:
      - main
      - spe-02/**

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run notification, shared, Finance Phase 2 and Pesapal regression suites
        run: >-
          bunx vitest run
          src/lib/notifications.test.ts
          src/lib/booking-lifecycle.test.ts
          src/lib/housekeeping-state-machine.test.ts
          src/lib/housekeeping-offline.test.ts
          src/domains/ai/concierge/request-categorization.test.ts
          src/domains/finance/payment-contract.test.ts
          src/domains/finance/finance-currency.test.ts
          src/domains/finance/pricing-engine.test.ts
          src/domains/finance/finance-reconciliation.test.ts
          src/domains/finance/seasonal-pricing.test.ts
          src/domains/finance/daily-rate-calendar.test.ts
          src/domains/finance/rate-overrides.test.ts
          src/domains/finance/rate-plan-restrictions.test.ts
          src/domains/finance/rate-plan-publication.test.ts
