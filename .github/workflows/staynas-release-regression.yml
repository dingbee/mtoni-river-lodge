name: StayNas release regression gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staynas-release-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
  public-navigation-e2e:
    name: Public and mobile navigation E2E
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PROJECT_ID: ci-placeholder
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/staynas_navigation_regression.py