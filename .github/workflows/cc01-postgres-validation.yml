name: CC-01 PostgreSQL migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261104210000_cc01_property_access_and_founder_authority.sql"
      - "supabase/tests/cc01-*.sql"
      - ".github/workflows/cc01-postgres-validation.yml"
  workflow_dispatch:

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staynas_cc01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staynas_cc01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load schema-only fixture and apply staged migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d staynas_cc01_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/cc01-schema-fixture.sql \
            -f supabase/migrations/20261104210000_cc01_property_access_and_founder_authority.sql

      - name: Verify grants, policies, property isolation and founder authority
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d staynas_cc01_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/cc01-migration-assertions.sql
