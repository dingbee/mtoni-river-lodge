name: StayNas DC-05.03/04 canonical reservation migrations
# Executes the real DC-03R allocator and DC-06 finance evidence gate in disposable PostgreSQL.

on:
  push:
    branches:
      - feat/dc05-*
      - feat/dc06-*
  pull_request:
    branches: [integration/dc05-foundation]
    paths:
      - "supabase/migrations/20261107010000_dc05_canonical_booking_materialization.sql"
      - "supabase/migrations/20261107020000_dc05_spe04_quote_success_contract.sql"
      - "supabase/migrations/20261107030000_dc05_trigger_function_execute_privileges.sql"
      - "supabase/migrations/20261107040000_dc05_unpaid_channel_booking_semantics.sql"
      - "supabase/migrations/20261107050000_dc05_reservation_lifecycle_reconciliation.sql"
      - "supabase/migrations/20261107060000_dc05_lifecycle_payload_retention_fix.sql"
      - "supabase/migrations/20261107070000_dc05_modified_cancellation_capability_fix.sql"
      - "supabase/migrations/20261107100000_dc05_06_provider_financial_evidence.sql"
      - "supabase/migrations/20261107110000_dc05_06_provider_reference_idempotency_fix.sql"
      - "supabase/review/20261107120000_dc05_07_operational_integration.sql"
      - "supabase/review/20261107140000_dc06_03_finance_evidence_visibility.sql"
      - "supabase/review/20261107160000_dc06_04_distribution_analytics.sql"
      - "scripts/ci/dc06-04-distribution-analytics-smoke.sql"
      - "src/domains/analytics/distribution-analytics.functions.ts"
      - "src/routes/_authenticated.admin.analytics.distribution.tsx"
      - "src/routes/_authenticated.admin.analytics.tsx"
      - "scripts/ci/dc05-07-operational-fixture.sql"
      - "scripts/ci/dc05-07-operational-smoke.sql"
      - "scripts/ci/dc05-06-provider-finance-smoke.sql"
      - "scripts/ci/dc06-03-finance-fixture.sql"
      - "scripts/ci/dc06-03-finance-evidence-smoke.sql"
      - "scripts/ci/dc05-reservation-lifecycle-fixture.sql"
      - "scripts/ci/dc05-reservation-lifecycle-smoke.sql"
      - "src/domains/finance/distribution-financial-evidence.functions.ts"
      - "src/routes/_authenticated.admin.finance.index.tsx"
      - "src/routes/_authenticated.admin.finance.reconciliation.tsx"
      - ".github/workflows/dc-05-materialization-migrations.yml"
      - "supabase/migrations/20261106140000_dc05_mapping_identity_resolution.sql"
      - "supabase/migrations/20261106180000_dc05_webhook_processing_replay.sql"
      - "scripts/ci/dc05-canonical-materialization-fixture.sql"
      - "scripts/ci/dc05-canonical-materialization-smoke.sql"

jobs:
  canonical-materialization-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staynas_dc05_03_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staynas_dc05_03_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare disposable Supabase-compatible fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc04-postgres-fixture.sql
      - name: Apply DC-04 durable distribution foundation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105140000_dc04_distribution_connection_persistence.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105150000_dc04_distribution_credential_broker.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105160000_dc04_distribution_operation_ledger.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105170000_dc04_distribution_outbox_dispatch.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261106010000_dc04_distribution_health_evidence.sql
      - name: Apply DC-05.05 webhook retry and replay foundation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261106180000_dc05_webhook_processing_replay.sql
      - name: Prepare isolated SPE-03 and canonical booking schema contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-canonical-materialization-fixture.sql
      - name: Apply canonical DC-03R atomic booking and inventory allocator
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105180000_dc03r_atomic_booking_inventory.sql
      - name: Apply DC-05.02 property-scoped resource mappings
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261106140000_dc05_mapping_identity_resolution.sql
      - name: Apply DC-05.03 canonical booking materialization
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107010000_dc05_canonical_booking_materialization.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107020000_dc05_spe04_quote_success_contract.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107030000_dc05_trigger_function_execute_privileges.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107040000_dc05_unpaid_channel_booking_semantics.sql
      - name: Apply DC-05.04 lifecycle fixture and migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-reservation-lifecycle-fixture.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107050000_dc05_reservation_lifecycle_reconciliation.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107060000_dc05_lifecycle_payload_retention_fix.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107070000_dc05_modified_cancellation_capability_fix.sql
      - name: Apply DC-05.06 provider financial evidence reconciliation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100000_dc05_06_provider_financial_evidence.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261107110000_dc05_06_provider_reference_idempotency_fix.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-06-provider-finance-smoke.sql
      - name: Verify DC-05.03 materialization and DC-05.04 lifecycle contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-canonical-materialization-smoke.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-reservation-lifecycle-smoke.sql
      - name: Prepare DC-05.07 operational integration fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-07-operational-fixture.sql
      - name: Apply DC-05.07 operational integration review migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/review/20261107120000_dc05_07_operational_integration.sql
      - name: Prepare DC-06.03 finance authorization fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc06-03-finance-fixture.sql
      - name: Apply DC-06.03 Finance evidence visibility review migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/review/20261107140000_dc06_03_finance_evidence_visibility.sql
      - name: Apply DC-06.04 distribution analytics review migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f supabase/review/20261107160000_dc06_04_distribution_analytics.sql
      - name: Verify DC-05.07, DC-06.03 and DC-06.04 integration contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc05-07-operational-smoke.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc06-03-finance-evidence-smoke.sql
          psql -h localhost -U postgres -d staynas_dc05_03_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc06-04-distribution-analytics-smoke.sql

  finance-application-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate routes and verify production build
        run: bun run build
      - name: TypeScript verification
        run: bunx tsc --noEmit
      - name: Finance regression tests
        run: bunx vitest run src/domains/finance
      - name: Lint changed Finance files
        run: bunx eslint src/domains/finance/distribution-financial-evidence.functions.ts src/routes/_authenticated.admin.finance.index.tsx src/routes/_authenticated.admin.finance.reconciliation.tsx --rule '{"@typescript-eslint/no-explicit-any":"off","prettier/prettier":"off"}'
      - name: Lint distribution analytics files
        run: bunx eslint src/domains/analytics/distribution-analytics.functions.ts src/routes/_authenticated.admin.analytics.distribution.tsx src/routes/_authenticated.admin.analytics.tsx --rule '{"@typescript-eslint/no-explicit-any":"off","prettier/prettier":"off"}'
