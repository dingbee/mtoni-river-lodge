name: CC-01 migration resequencing (one-time)

on:
  push:
    branches:
      - feat/cc01-p0-commercial-foundation

permissions:
  contents: write

concurrency:
  group: cc01-migration-resequence
  cancel-in-progress: false

jobs:
  resequence:
    if: github.ref == 'refs/heads/feat/cc01-p0-commercial-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cc01-p0-commercial-foundation
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Generate a correctly ordered migration using the Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          OLD="supabase/migrations/20261104210000_cc01_property_access_and_founder_authority.sql"
          test -s "$OLD"
          supabase --version
          supabase migration new cc01_property_access_and_founder_authority
          NEW="$(find supabase/migrations -maxdepth 1 -type f -name '*_cc01_property_access_and_founder_authority.sql' ! -path "$OLD" | sort | tail -n 1)"
          test -n "$NEW"
          VERSION="$(basename "$NEW" | cut -d_ -f1)"
          if [[ "$VERSION" -le "20261105082849" ]]; then
            echo "Generated migration $VERSION is not later than production ledger 20261105082849"
            exit 1
          fi
          cp "$OLD" "$NEW"
          sed -i "s#supabase/migrations/20261104210000_cc01_property_access_and_founder_authority.sql#$NEW#g" .github/workflows/p1-build.yml
          rm "$OLD"
          rm .github/workflows/cc01-migration-resequence.yml
          git diff --check
          git add "$NEW" "$OLD" .github/workflows/p1-build.yml .github/workflows/cc01-migration-resequence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(cc01): resequence migration after production ledger"
          git push origin HEAD:feat/cc01-p0-commercial-foundation
