name: StayNas DC-04 migration and credential isolation

concurrency:
  group: dc04-migrations-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, integration/dc05-foundation]
    paths:
      - "supabase/migrations/2026110514*_dc04_distribution_connection_persistence.sql"
      - "supabase/migrations/2026110515*_dc04_distribution_credential_broker.sql"
      - "supabase/migrations/2026110516*_dc04_distribution_operation_ledger.sql"
      - "supabase/migrations/2026110517*_dc04_distribution_outbox_dispatch.sql"
      - "supabase/migrations/2026110601*_dc04_distribution_health_evidence.sql"
      - "supabase/migrations/2026110618*_dc05_webhook_processing_replay.sql"
      - "scripts/ci/dc04-postgres-fixture.sql"
      - "scripts/ci/dc04-postgres-smoke.sql"
      - "scripts/ci/dc05-postgres-smoke.sql"
      - ".github/workflows/dc-04-migrations.yml"
  push:
    branches:
      - feat/dc-04-*
      - feat/dc-05-*
      - main

jobs:
  migration-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staynas_dc04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staynas_dc04_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
