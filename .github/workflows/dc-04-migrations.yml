name: StayNas DC-04 migration and credential isolation

concurrency:
  group: dc04-migrations-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/2026110514*_dc04_distribution_connection_persistence.sql"
      - "supabase/migrations/2026110515*_dc04_distribution_credential_broker.sql"
      - "supabase/migrations/2026110516*_dc04_distribution_operation_ledger.sql"
      - "supabase/migrations/2026110517*_dc04_distribution_outbox_dispatch.sql"
      - "scripts/ci/dc04-postgres-fixture.sql"
      - "scripts/ci/dc04-postgres-smoke.sql"
      - ".github/workflows/dc-04-migrations.yml"
  push:
    branches:
      - feat/dc-04-*
      - main

jobs:
  migration-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staynas_dc04_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d staynas_dc04_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare disposable Supabase-compatible fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc04-postgres-fixture.sql
      - name: Apply DC-04 persistence and credential broker migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105140000_dc04_distribution_connection_persistence.sql
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105150000_dc04_distribution_credential_broker.sql
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105160000_dc04_distribution_operation_ledger.sql
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261105170000_dc04_distribution_outbox_dispatch.sql
      - name: Verify tenant, capability, Vault and audit boundaries
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d staynas_dc04_ci -v ON_ERROR_STOP=1 -f scripts/ci/dc04-postgres-smoke.sql
